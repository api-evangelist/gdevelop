aid: gdevelop
name: GDevelop
description: >-
  GDevelop is an open-source, no-code, cross-platform 2D/3D and multiplayer game
  engine designed for everyone. Creators build games visually with a
  drag-and-drop event system (with optional JavaScript to extend behavior) and
  export in one click to web browsers, Android, iOS, Steam, and desktop. GDevelop
  offers a web editor and a downloadable desktop app, an asset store, cloud
  project storage, leaderboards, and multiplayer features, and is developed in
  the open on GitHub (4ian/GDevelop). It ships with a documented JavaScript
  runtime (GDJS), an extensive wiki, and a games platform for publishing and
  monetizing creations. Added to the API Evangelist network as a Seedcamp
  portfolio company and enriched via the pipeline.
